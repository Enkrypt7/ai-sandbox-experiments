name: Simulated bridge pilot
on:
  workflow_dispatch:
  push:
    paths:
      - 'experiments/bridge/**'
      - '.github/workflows/bridge-pilot.yml'
permissions:
  contents: read
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check frozen prompts and exercise live adapter with loopback fixtures
        run: python3 experiments/bridge/verify.py
      - name: Verify simulated episodes and publish summary
        run: |
          python3 experiments/bridge/bridge_pilot.py --dry-run --output simulated.jsonl
          python3 experiments/bridge/report.py simulated.jsonl 1 > simulated.md
          cat simulated.md >> "$GITHUB_STEP_SUMMARY"
          echo 'Loopback tests passed for a restricted crossing, invalid action, and provider-filtered response.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: simulated-bridge-results
          path: |
            simulated.jsonl
            simulated.md
